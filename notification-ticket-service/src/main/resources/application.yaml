server:
  port: 8082 # Puerto diferenciado para evitar colisiones

spring:
  application:
    name: notification-ticket-service

  # Conexión a RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual # Exigencia clave: Confirmación manual (ACK/NACK)
        missing-queues-fatal: false
        prefetch: 1 # Procesa 1 mensaje a la vez para balanceo óptimo

  # Conexión Kafka (clúster de 3 brokers del docker-compose.kafka.yml)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Configuración centralizada de RabbitMQ para Faster 360
faster360:
  messaging:
    exchange: faster360.orders.exchange
    dlx: faster360.orders.dlx
    routing-keys:
      order-created: order.created
      notification-dead-letter: order.notification.dead-letter
      ticket-dead-letter: order.ticket.dead-letter
      audit-dead-letter: order.audit.dead-letter
    queues:
      notification: faster360.orders.notification.queue
      ticket: faster360.orders.ticket.queue
      audit: faster360.orders.audit.queue
      notification-dlq: faster360.orders.notification.dlq
      ticket-dlq: faster360.orders.ticket.dlq
      audit-dlq: faster360.orders.audit.dlq
    # false = los mensajes fallidos se acumulan en las DLQ (para verlos en la consola de RabbitMQ)
    dlq-audit-enabled: ${DLQ_AUDIT_ENABLED:true}

# Kafka: tópicos (administrados por kafka-admin-service), consumer groups y política de errores
  kafka:
    topics:
      events: faster360.orders.events
      analytics: faster360.orders.analytics
      dlt: faster360.orders.events.dlt
    groups:
      order-events: faster360-order-events-group
      analytics: faster360-analytics-group
      dlt: faster360-dlt-group
    consumer:
      concurrency: 3            # hilos por listener (<= particiones del tópico)
      max-poll-records: 50
      session-timeout-ms: 30000
    retry:
      max-attempts: 3           # reintentos antes de enviar al DLT
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 8000
