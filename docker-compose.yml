name: faster360

# Infraestructura base: Base de Datos PostgreSQL para OrderService.
# RabbitMQ (clúster) y Kafka viven en sus propios compose:
#   - docker-compose.rabbitmq-cluster.yml
#   - docker-compose.kafka.yml
#   - docker-compose.kafka-ui.yml
services:
  postgres:
    image: postgres:15-alpine
    container_name: faster360-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: faster360_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
