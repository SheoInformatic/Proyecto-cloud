server:
  port: 8083

spring:
  application:
    name: rabbit-admin-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Solo estas cuentas (correos del IDaaS, separados por coma) pueden usar la API de administración
faster360:
  security:
    admin-emails: ${RABBIT_ADMIN_EMAILS:om.nieto@duocuc.cl}
